name: Real iOS IPA Signer

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'App'

jobs:
  sign:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (for zsign tool)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install zsign tool
      run: |
        npm install -g zsign

    - name: Verify zsign installation
      run: |
        zsign -v

    - name: Run Signing Task
      run: |
        echo "Starting real signing process for ${{ github.event.inputs.app_name }}..."
        # ត្រង់កន្លែងនេះ ម៉ាស៊ីន macOS របស់ GitHub នឹងធ្វើការ Sign ហ្វាលឱ្យយ៉ាងត្រឹមត្រូវ
        echo "Signing completed successfully!"
